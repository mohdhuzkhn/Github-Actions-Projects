name: Python CI

on:
  push:

jobs:
  python-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python Version
        run: python --version

      - name: Install Dependencies
        run: pip install -r requirements.txt